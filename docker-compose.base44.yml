services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
    restart: unless-stopped
