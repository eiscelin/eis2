<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img">
  <title>MetMuk</title>
  <defs>
    <!-- Blue squircle surface: light falls from the top-left -->
    <linearGradient id="tile" x1="0.14" y1="0" x2="0.86" y2="1">
      <stop offset="0" stop-color="#4a9dff"/>
      <stop offset="0.42" stop-color="#1877f2"/>
      <stop offset="1" stop-color="#0b4a9c"/>
    </linearGradient>

    <linearGradient id="shade" x1="0" y1="0.15" x2="0.85" y2="1">
      <stop offset="0.35" stop-color="#04204a" stop-opacity="0"/>
      <stop offset="1" stop-color="#04204a" stop-opacity="0.5"/>
    </linearGradient>

    <radialGradient id="sheen" cx="0.24" cy="0.1" r="0.78">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Front face of the extruded letter -->
    <linearGradient id="ink" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fbfcfe"/>
      <stop offset="1" stop-color="#e4e9f0"/>
    </linearGradient>

    <linearGradient id="bevel" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Lowercase "m": heavy rounded strokes, two open counters -->
    <path id="m" d="M137 331 Q128 331 128 322 L128 208 A27 27 0 0 1 155 181 L357 181 A27 27 0 0 1 384 208 L384 322 Q384 331 375 331 L339 331 Q330 331 330 322 L330 258.5 A23.5 23.5 0 0 0 283 258.5 L283 322 Q283 331 274 331 L238 331 Q229 331 229 322 L229 258.5 A23.5 23.5 0 0 0 182 258.5 L182 322 Q182 331 173 331 Z"/>

    <filter id="letterShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#03204d" flood-opacity="0.45"/>
    </filter>

    <!-- Matte grain, clipped to the letter by its own alpha -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComposite in="mono" in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#shade)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- Extruded letter: solid side, then the lit front face -->
  <use href="#m" x="8" y="14" fill="#082a58"/>
  <use href="#m" x="4" y="7" fill="#0d3d78"/>
  <g filter="url(#letterShadow)">
    <use href="#m" fill="url(#ink)"/>
    <use href="#m" fill="none" stroke="url(#bevel)" stroke-width="5"/>
  </g>

  <!-- Subtle matte texture on the letter -->
  <use href="#m" filter="url(#grain)" opacity="0.14" style="mix-blend-mode:multiply"/>
</svg>
